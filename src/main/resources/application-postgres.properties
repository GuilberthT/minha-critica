# Perfil PostgreSQL. Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Antes, crie o banco:  CREATE DATABASE minhacritica;
spring.datasource.url=jdbc:postgresql://localhost:5432/minhacritica
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
