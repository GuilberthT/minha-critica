<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main id="conteudo" tabindex="-1" class="container container-estreito secao centro">
    <p class="codigo-erro" aria-hidden="true" th:text="${status}">500</p>
    <h1>Algo deu errado</h1>
    <p>Não foi possível concluir sua solicitação. Tente novamente em instantes.</p>
    <a th:href="@{/}" class="botao botao-primario">Ir para o início</a>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
