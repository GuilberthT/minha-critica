<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main id="conteudo" tabindex="-1" class="container secao">
    <h1>Catálogo</h1>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- Filtro por tipo: links simples, funcionam sem JavaScript -->
    <nav aria-label="Filtrar por tipo" class="abas">
        <ul>
            <li>
                <a th:href="${#strings.isEmpty(q)} ? @{/obras} : @{/obras(q=${q})}" th:classappend="${tipoSelecionado == null} ? 'ativa'"
                   th:attr="aria-current=${tipoSelecionado == null} ? 'page' : null">Tudo</a>
            </li>
            <li th:each="t : ${tipos}">
                <a th:href="${#strings.isEmpty(q)} ? @{/obras(tipo=${t})} : @{/obras(tipo=${t}, q=${q})}" th:classappend="${t == tipoSelecionado} ? 'ativa'"
                   th:attr="aria-current=${t == tipoSelecionado} ? 'page' : null"
                   th:text="${t.name() == 'SERIE'} ? 'Séries' : (${t.name() == 'FILME'} ? 'Filmes' : 'Livros')">Filmes</a>
            </li>
        </ul>
    </nav>

    <form th:action="@{/obras}" method="get" class="filtros" role="search" aria-label="Buscar no catálogo">
        <input type="hidden" name="tipo" th:if="${tipoSelecionado}" th:value="${tipoSelecionado}">
        <div class="campo">
            <label for="q">Buscar por título</label>
            <input type="search" id="q" name="q" th:value="${q}" placeholder="Ex.: Dom Casmurro">
        </div>
        <button type="submit" class="botao botao-secundario">Buscar</button>
        <a th:unless="${#strings.isEmpty(q)}" th:href="${tipoSelecionado == null} ? @{/obras} : @{/obras(tipo=${tipoSelecionado})}" class="limpar">Limpar busca</a>
    </form>

    <p class="texto-suave contagem" role="status" aria-live="polite"
       th:text="${#lists.size(obras)} == 1 ? '1 obra encontrada' : |${#lists.size(obras)} obras encontradas|">
        0 obras encontradas
    </p>

    <p sec:authorize="isAnonymous()" class="caixa-info">
        Clique em uma capa para ler as críticas. Vamos pedir para você
        <a th:href="@{/login}">entrar</a> ou <a th:href="@{/cadastro}">criar uma conta</a> antes.
    </p>

    <div th:if="${#lists.isEmpty(obras)}" class="vazio">
        <p>Nenhuma obra com esse título. Confira a grafia ou veja o catálogo completo.</p>
        <a th:href="@{/obras}" class="botao botao-secundario">Ver tudo</a>
    </div>

    <ul class="grade-posters" th:unless="${#lists.isEmpty(obras)}">
        <li th:each="obra : ${obras}">
            <a th:replace="~{fragments/layout :: poster(${obra})}"></a>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
