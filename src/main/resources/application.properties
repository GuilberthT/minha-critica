spring.application.name=minha-critica
server.port=8080

# ===== Banco de dados (padrão: H2 relacional gravado em arquivo ./data) =====
# Os dados persistem entre execuções. Para usar PostgreSQL, rode com o perfil "postgres".
spring.datasource.url=jdbc:h2:file:./data/minhacritica;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Mensagens em português =====
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Não mostra detalhes internos (stack trace) em páginas de erro
server.error.include-stacktrace=never
